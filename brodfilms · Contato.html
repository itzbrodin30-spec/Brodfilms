<head>

<title>brodfilms · Filmmaker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Sora:wght@300;400;600&display=swap">
<style>
:root{
  --bg:#040705;--ink:#E8F5EC;--muted:#7F9487;--g1:#19FF8C;--g2:#0A7A45;--line:#19FF8C55;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Sora","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.shard{position:absolute;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,transparent);animation:in 1.3s cubic-bezier(.2,.7,.2,1) both}
.s1{top:-5%;left:-22%;width:72%;height:30%;opacity:.55;clip-path:polygon(0 0,100% 0,62% 100%,0 70%);--t:-40px,-30px}
.s2{top:30%;right:-28%;width:60%;height:18%;opacity:.28;clip-path:polygon(35% 0,100% 20%,100% 100%,0 80%);--t:60px,0}
.s3{bottom:-8%;right:-16%;width:78%;height:36%;opacity:.5;clip-path:polygon(100% 0,100% 100%,0 100%,30% 30%);--t:50px,50px}
.s4{bottom:26%;left:-32%;width:56%;height:14%;opacity:.25;clip-path:polygon(0 20%,100% 0,70% 100%,0 100%);--t:-60px,0}
@keyframes in{from{opacity:0;transform:translate(var(--t))}}
@media (prefers-reduced-motion:reduce){.shard{animation:none}}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:30px 22px 36px}
h1{margin:0;font-family:"Unbounded","Arial Black",Arial,sans-serif;font-weight:600;font-size:clamp(30px,9.4vw,40px);letter-spacing:-.02em;line-height:1}
.tag{margin:12px 0 0;color:var(--muted);font-weight:300;font-size:15px}
.hero{position:relative;margin:26px -22px 0;aspect-ratio:4/5;overflow:hidden;clip-path:polygon(0 0,100% 7%,100% 100%,0 100%)}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1) contrast(1.15) brightness(.82)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;mix-blend-mode:screen;
  background:linear-gradient(155deg,rgba(25,255,140,.6),rgba(10,122,69,.28) 42%,transparent 72%)}
.hero::after{content:"";position:absolute;inset:0;z-index:2;
  background:linear-gradient(to bottom,transparent 50%,var(--bg) 100%)}
.actions{position:relative;z-index:3;display:grid;gap:12px;margin-top:-64px}
.btn{display:block;text-align:center;text-decoration:none;padding:17px 20px;font-weight:600;font-size:15px;letter-spacing:.01em;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.primary{background:linear-gradient(120deg,var(--g1),#0FD16F);color:#03110A}
.secondary{background:rgba(25,255,140,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #fff}
.num{margin:26px 0 0;text-align:center;color:var(--muted);font-size:13px;font-weight:300;letter-spacing:.04em}
</style>
</head>
